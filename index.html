        /* Styl własnego, animowanego powiadomienia */

            border-radius: 8px;

            /* Płynna animacja wsuwania i wysuwania */
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;

        }

            <p class="subtitle">Zapisuj nadchodzące sprawdziany, projekty i prace domowe.</p>
    
        <div style="background: var(--bg-list); padding: 15px; border-radius: 10px; border: 1px solid var(--border-color); margin-bottom: 20px;">

            <!-- Dodane oninput, które na bieżąco sprawdza wpisywany tekst -->

            <button class="main-btn add-todo-btn" onclick="addTodoItem()">Dodaj</button>
        </div>

<!-- Ukryty kontener z dodatkowymi polami - kategoria na samej górze -->

                <option value="exam">Sprawdzian / Kartkówka</option>
                <option value="project">Projekt / Prezentacja</option>
            </select>

            <label for="todoDate">Termin wykonania:</label>
            <input type="date" id="todoDate">
            
            <label for="todoNotes">Dodatkowe informacje / szczegóły:</label>

<script>
    // Inicjalizacja tablicy zadań domowych z pamięci przeglądarki
let todoItems = JSON.parse(localStorage.getItem('schoolTodoList')) || [];

// Dodaj wywołanie renderu zadań do ogólnej funkcji startowej (np. pod updateUI(); na dole)
function renderTodos() {
    const container = document.getElementById('todoListContainer');
    container.innerHTML = '';
    
    if (todoItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:var(--text-sub); padding: 15px;">Wszystko Gotowe!</div>';
        return;
    }
    
    todoItems.forEach(todo => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'todo-item';
        
        // Wymuszenie pełnej szerokości wiersza i wyrównania do lewej strony
        itemDiv.setAttribute('style', 'display: flex !important; flex-direction: column !important; width: 100% !important; box-sizing: border-box !important; padding: 12px 10px !important; border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important; background: transparent !important; text-align: left !important;');
        
        let detailsHtml = '';
        if (todo.date || todo.notes) {
            // Szczegóły zadania ładnie wyrównane pod tekstem głównym
            detailsHtml = `<div class="todo-details" style="text-align: left !important; padding-left: 5px !important; margin-top: 5px !important;">`;
            if (todo.date) detailsHtml += `<span class="todo-date" style="display: block; font-weight: bold; color: #047973; font-size: 13px;">Termin: ${todo.date}</span>`;
            if (todo.notes) detailsHtml += `<span class="todo-notes" style="display: block; color: var(--text-sub); font-size: 13px;">${todo.notes}</span>`;
            detailsHtml += `</div>`;
        }
        
        // Struktura bez checkboxa: kliknięcie w sam tekst zmienia status zadania
        itemDiv.innerHTML = `
            <div class="todo-row" style="display: flex !important; justify-content: space-between !important; align-items: center !important; width: 100% !important; background: transparent !important;">
                
                <!-- Lewa strona: Tekst przedmiotu (kliknięcie przekreśla) -->
                <div class="todo-text-container ${todo.completed ? 'done' : ''}" onclick="toggleTodoStatus(${todo.id})" style="display: flex !important; align-items: center !important; flex: 1 !important; text-align: left !important; cursor: pointer; padding: 4px 0;">
                    <span style="font-weight: 600; color: var(--text-main); font-size: 16px; text-align: left !important;">${todo.text}</span>
                </div>
                
                <!-- Prawa strona: Przycisk usuwania (kosz) -->
                <button class="delete-todo-btn" onclick="deleteTodoItem(${todo.id})" style="background: transparent !important; border: none !important; color: #dc3545; cursor: pointer; font-size: 16px; padding: 6px !important; margin: 0 !important; width: auto !important; height: auto !important; display: inline-flex !important; align-items: center !important; justify-content: center !important; box-shadow: none !important;">🗑️</button>
            
            </div>
            ${detailsHtml}
        `;
        
        container.appendChild(itemDiv);
    });
}


// Funkcja obsługująca płynne przełączanie kart na górze
function switchTab(sectionId, element) {
    // Ukryj wszystkie sekcje i dezaktywuj przyciski
    document.querySelectorAll('.app-section').forEach(sec => sec.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    
    // Pokaż wybraną sekcję i podświetl przycisk
    document.getElementById(sectionId).classList.add('active');
    element.classList.add('active');
}

// Funkcja dodawania nowego zadania domowego
// Lista słów, które aktywują dodatkowe pola (możesz dopisać własne przedmioty)
const schoolSubjects = [
    "matematyka", "matma", "mat", "polski", "pol", "angielski", "ang", "historia", "hist", 
    "biologia", "biol", "chemia", "fizyka", "fiz", "geografia", "geogr", "informatyka", "inf", "wf", "edukacja zdrowotna", "ez", "zwych", "z wychowawcą", "technika", "tech", "plastyka", "plast", "rel", "religia"
];

// Funkcja sprawdzająca w locie, czy użytkownik wpisał przedmiot szkolny
function checkTodoInput(value) {
    const extraFields = document.getElementById('extraFields');
    const textLower = value.toLowerCase().trim();
    
    // Sprawdzamy, czy wpisany tekst zawiera w sobie któreś ze słów z listy schoolSubjects
    const zawieraPrzedmiot = schoolSubjects.some(subject => textLower.includes(subject));
    
    if (zawieraPrzedmiot) {
        extraFields.classList.add('visible');
    } else {
        extraFields.classList.remove('visible');
    }
}

function addTodoItem() {
    const input = document.getElementById('todoInput');
    const typeInput = document.getElementById('todoType');
    const dateInput = document.getElementById('todoDate');
    const notesInput = document.getElementById('todoNotes');
    
    // Jeśli z jakiegoś powodu pole tekstowe nie istnieje, przerywamy bezpiecznie
    if (!input) return;
    
    const todoText = input.value.trim();
    
    if (todoText !== "") {
        let formattedDate = "";
        
        if (dateInput && dateInput.value) {
            const d = new Date(dateInput.value);
            formattedDate = d.toLocaleDateString('pl-PL', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        // Bezpieczne pobranie wartości kategorii (jeśli pole nie istnieje, domyślnie ustawia 'homework')
        const selectedType = typeInput ? typeInput.value : 'homework';
        const notesValue = notesInput ? notesInput.value.trim() : '';

        const newTodo = {
            id: Date.now(),
            text: todoText,
            type: selectedType, 
            date: formattedDate,
            notes: notesValue,
            completed: false
        };
        
        todoItems.push(newTodo);
        localStorage.setItem('schoolTodoList', JSON.stringify(todoItems));
        
        // Czyszczenie i resetowanie pól (zabezpieczone przed błędami braku elementów)
        input.value = '';
        if (typeInput) typeInput.value = 'homework';
        if (dateInput) dateInput.value = '';
        if (notesInput) notesInput.value = '';
        
        const extraFields = document.getElementById('extraFields');
        if (extraFields) extraFields.classList.remove('visible');
        
        renderTodos();
    }
}


function renderTodos() {
    const container = document.getElementById('todoListContainer');
    container.innerHTML = '';
    
    if (todoItems.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:var(--text-sub); padding: 15px;">Wszystko Gotowe!</div>';
        return;
    }
    
    todoItems.forEach(todo => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'todo-item';
        
        // WYMUSZENIE UKŁADU: Każde zadanie to pionowy kontener zajmujący 100% szerokości
        itemDiv.setAttribute('style', 'display: flex !important; flex-direction: column !important; width: 100% !important; box-sizing: border-box !important; padding: 12px 10px !important; border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important; background: transparent !important; text-align: left !important;');
        
        let detailsHtml = '';
        if (todo.date || todo.notes) {
            // Dodatkowe informacje wyrównane do lewej strony
            detailsHtml = `<div class="todo-details" style="text-align: left !important; padding-left: 30px !important; margin-top: 5px !important;">`;
            if (todo.date) detailsHtml += `<span class="todo-date" style="display: block; font-weight: bold; color: #28a745; font-size: 13px;">📅 Termin: ${todo.date}</span>`;
            if (todo.notes) detailsHtml += `<span class="todo-notes" style="display: block; color: var(--text-sub); font-size: 13px;">📝 ${todo.notes}</span>`;
            detailsHtml += `</div>`;
        }
        
        // NOWY, NIEZALEŻNY UKŁAD STRUKTURALNY HTML
        itemDiv.innerHTML = `
            <div class="todo-row" style="display: flex !important; justify-content: space-between !important; align-items: center !important; width: 100% !important; background: transparent !important;">
                
                <!-- Lewa strona: Checkbox i Tekst (spięte razem, wyrównane do lewej) -->
                <div class="todo-text-container ${todo.completed ? 'done' : ''}" onclick="toggleTodoStatus(${todo.id})" style="display: flex !important; align-items: center !important; gap: 12px !important; flex: 1 !important; text-align: left !important; cursor: pointer;">
                    <input type="checkbox" class="todo-checkbox" ${todo.completed ? 'checked' : ''} onclick="event.stopPropagation(); toggleTodoStatus(${todo.id});" style="width: 18px; height: 18px; margin: 0; cursor: pointer;">
                    <span style="font-weight: 600; color: var(--text-main); font-size: 16px; text-align: left !important;">${todo.text}</span>
                </div>
                
                <!-- Prawa strona: Samotny kosz przyklejony do prawej krawędzi -->
                <button class="delete-todo-btn" onclick="deleteTodoItem(${todo.id})" style="background: transparent !important; border: none !important; color: #dc3545; cursor: pointer; font-size: 16px; padding: 6px !important; margin: 0 !important; width: auto !important; height: auto !important; display: inline-flex !important; align-items: center !important; justify-content: center !important; box-shadow: none !important;">Usuń</button>
            
            </div>
            ${detailsHtml}
        `;
        
        container.appendChild(itemDiv);
    });
}




// Przełączanie statusu zrobione / niezrobione po kliknięciu
function toggleTodoStatus(id) {
    todoItems = todoItems.map(todo => {
        if (todo.id === id) todo.completed = !todo.completed;
        return todo;
    });
    localStorage.setItem('schoolTodoList', JSON.stringify(todoItems));
    renderTodos();
}

// Usuwanie zadania domowego z listy
function deleteTodoItem(id) {
    todoItems = todoItems.filter(todo => todo.id !== id);
    localStorage.setItem('schoolTodoList', JSON.stringify(todoItems));
    renderTodos();
}

    let averageHistory = JSON.parse(localStorage.getItem('avgHistoryData')) || [];
    let timelineChart = null;

    // Wywołujemy inicjalizację od razu po załadowaniu elementów HTML
    document.addEventListener("DOMContentLoaded", function() {
        initChart();
        updateUI();
        renderTodos();
    });

    function addAverageRecord() {
        const input = document.getElementById('averageInput');
        const avgValue = parseFloat(input.value);

        if (!isNaN(avgValue) && avgValue >= 1 && avgValue <= 6) {
            const now = new Date();
            const formattedDate = now.toLocaleDateString('pl-PL', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            }) + ' ' + now.toLocaleTimeString('pl-PL', {
                hour: '2-digit',
                minute: '2-digit'
            });

            const newRecord = {
                date: formattedDate,
                value: avgValue.toFixed(2)
            };

            averageHistory.push(newRecord);
            localStorage.setItem('avgHistoryData', JSON.stringify(averageHistory));
            
            input.value = ''; 
            updateUI();
        } else {
            showAlert('Proszę wpisać poprawną wartość średniej w przedziale od 1.0 do 6.0!');
        }
    }

    function initChart() {
        const ctx = document.getElementById('averageTimelineChart').getContext('2d');
        timelineChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [], 
                datasets: [{
                    label: 'Twoja średnia',
                    data: [], 
                    borderColor: '#047973',
                    backgroundColor: 'rgb(4, 121, 115, 0.2)',
                    borderWidth: 3,
                    lineTension: 0.2, // Poprawiona składnia dla wersji 2.x
                    fill: true,
                    pointBackgroundColor: '#047973',
                    pointRadius: 5
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    yAxes: [{ // Poprawiona struktura osi dla wersji 2.x
                        ticks: {
                            min: 1,
                            max: 6,
                            stepSize: 0.5
                        }
                    }]
                }
            }
        });
    }

    function updateUI() {
        const historyLog = document.getElementById('historyLog');
        historyLog.innerHTML = '';

        if (averageHistory.length === 0) {
            historyLog.innerHTML = '<div style="text-align:center; color:#888; padding: 10px;">Brak zapisanych wpisów</div>';
        }

        let chartLabels = [];
        let chartData = [];

        averageHistory.forEach((record) => {
            chartLabels.push(record.date);
            chartData.push(record.value);

            const item = document.createElement('div');
            item.className = 'history-item';
            item.innerHTML = `<span class="date">${record.date}</span><span class="val">${record.value}</span>`;
            historyLog.appendChild(item);
        });

        historyLog.scrollTop = historyLog.scrollHeight;

        if (timelineChart) {
            timelineChart.data.labels = chartLabels;
            timelineChart.data.datasets[0].data = chartData; // Poprawiony i stabilny zapis
            timelineChart.update();
        }
    }

    function clearHistory() {
        if(confirm("Czy na pewno chcesz usunąć całą zapisaną historię średnich?")) {
            averageHistory = [];
            localStorage.removeItem('avgHistoryData');
            updateUI();
        }
    }
    // Funkcja wyświetlająca własne, animowane powiadomienie z góry ekranu
function showAlert(message) {
    const alertBox = document.getElementById('customAlert');
    
    // Ustawiamy tekst błędu
    alertBox.innerText = message;
    
    // Dodajemy klasę, która uruchamia animację wsuwania
    alertBox.classList.add('show');
    
    // Po 3 sekundach (3000 ms) automatycznie chowamy powiadomienie
    setTimeout(() => {
        alertBox.classList.remove('show');
    }, 3000);
}

</script>
